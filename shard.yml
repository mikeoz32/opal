name: opal
version: 0.1.0
description: Modular HTTP, dependency injection, application bootstrap, and persistence toolkit for Crystal
repository: https://github.com/mikeoz32/opal

authors:
  - Mike Oz <kozloffsky@hotmail.com>

targets:
  opal:
    main: src/opal.cr

crystal: ">= 1.21.0"

license: MIT

dependencies:
  db:
    github: crystal-lang/crystal-db
    version: ~> 0.14

development_dependencies:
  jwt:
    github: crystal-community/jwt
    version: ~> 1.7
  sqlite3:
    github: crystal-lang/crystal-sqlite3
  pg:
    github: will/crystal-pg
    version: ~> 0.30
