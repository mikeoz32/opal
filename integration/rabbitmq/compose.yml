services:
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: opal
      RABBITMQ_DEFAULT_PASS: opal
      RABBITMQ_DEFAULT_VHOST: opal_test
    ports:
      - "5673:5672"
      - "5553:5552"
      - "15673:15672"
    command: >-
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stream rabbitmq_stream_management && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
