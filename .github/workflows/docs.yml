name: Documentation

# Documentation checks are manual while repository-wide automatic CI is
# intentionally disabled. Run this workflow before publishing or merging a
# documentation-heavy change.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build guides and Crystal API reference
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Install Crystal dependencies
        run: shards install

      - name: Build documentation
        run: scripts/check_docs.sh

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: opal-documentation
          path: build/docs/site
