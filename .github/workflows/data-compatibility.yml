name: Data compatibility

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  crystal-1-21:
    name: Crystal 1.21.0 data compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev

      - name: Install dependencies
        run: shards install

      - name: Check dependency resolution
        run: shards check

      - name: Check formatting
        run: git ls-files -z '*.cr' | xargs -0 crystal tool format --check

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD

      - name: Compile generic dialect dispatch
        run: crystal build --no-codegen spec/fixtures/data/dialect_virtual_generic_dispatch.cr

      - name: Run static SQL specs
        run: >-
          crystal spec
          spec/data/sql/static_plan_compiler_spec.cr
          spec/data/dialects/sqlite_spec.cr
          spec/data/dialects/returning_probe_spec.cr
          spec/data/dialects/specialization_spec.cr
          --no-color

      - name: Run complete root specs
        run: crystal spec --no-color

      - name: Build release target
        run: shards build --release

      - name: Build API documentation
        run: crystal docs

      - name: Install Data example dependencies
        working-directory: examples/data_layer_sqlite
        run: shards install

      - name: Check Data example dependency resolution
        working-directory: examples/data_layer_sqlite
        run: shards check

      - name: Run Data example specs
        working-directory: examples/data_layer_sqlite
        run: crystal spec --no-color

      - name: Build Data example release targets
        working-directory: examples/data_layer_sqlite
        run: shards build --release

      - name: Install Todo example dependencies
        working-directory: examples/todo_api_sqlite
        run: shards install

      - name: Check Todo example dependency resolution
        working-directory: examples/todo_api_sqlite
        run: shards check

      - name: Run Todo example specs
        working-directory: examples/todo_api_sqlite
        run: crystal spec --no-color

      - name: Build Todo example release target
        working-directory: examples/todo_api_sqlite
        run: shards build --release

      - name: Install LiveView example dependencies
        working-directory: examples/live_view_counter
        run: shards install

      - name: Check LiveView example dependency resolution
        working-directory: examples/live_view_counter
        run: shards check

      - name: Run LiveView example specs
        working-directory: examples/live_view_counter
        run: crystal spec --no-color

      - name: Build LiveView example release target
        working-directory: examples/live_view_counter
        run: shards build --release
